# Checks the data, the boundary and the page on every change.
# The checks themselves are in .github/check_site.py.
name: Check site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the data, the boundary and the page
        run: python3 .github/check_site.py
